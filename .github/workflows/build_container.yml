---
# Managed by modulesync - DO NOT EDIT
# https://voxpupuli.org/docs/updating-files-managed-with-modulesync/

name: 📦 Build and Publish

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    tags:
      - 'v[1-9][0-9]*.*.*'
  workflow_dispatch:

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-matrix:
    name: Set up build matrix
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.build-matrix.outputs.build-matrix }}
      manifest-matrix: ${{ steps.manifest-matrix.outputs.manifest-matrix }}
      openvox-release: ${{ steps.openvox-release.outputs.value }}
      openvox-version: ${{ steps.openvox-version.outputs.value }}
      voxbox-version: ${{ steps.voxbox-version.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install yq
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1.3.1

      - name: Generate build matrix
        id: build-matrix
        run: |
          matrix_json=$(yq -o=json build_platforms.yaml | jq -c)
          echo "build-matrix=$matrix_json" >> "$GITHUB_OUTPUT"

      - name: Generate manifest matrix
        id: manifest-matrix
        run: |
          matrix_json=$(yq -o=json build_platforms.yaml | jq -c '{include: [.include[] | {openvox_release, openvox_version}] | unique_by(.openvox_version)}')
          echo "manifest-matrix=$matrix_json" >> "$GITHUB_OUTPUT"

      - name: Select stable OpenVox release
        id: openvox-release
        run: |
          echo "value=9" >> "$GITHUB_OUTPUT"

      - name: Select stable OpenVox version
        id: openvox-version
        run: |
          value=$(yq -o=json build_platforms.yaml | jq -er '[.include[] | select(.openvox_release == 9) | .openvox_version] | unique | if length == 1 then .[0] else error("Configure exactly one OpenVox 9 version in build_platforms.yaml") end')
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Determine VoxBox version
        id: voxbox-version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then [[ "$GITHUB_REF_NAME" =~ ^v[1-9][0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must match vX.Y.Z with a major version of at least 10" >&2; exit 1; }; value="${GITHUB_REF_NAME#v}"; else value="main-${GITHUB_SHA::7}"; fi; echo "value=$value" >> "$GITHUB_OUTPUT"

  build-and-push-container:
    name: Build VoxBox ${{ matrix.openvox_version }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs:
      - setup-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.build-matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and publish container
        id: build
        uses: voxpupuli/gha-build-and-publish-a-container@f1680271a3fd34267c1401c760a15f45a9cf34ca # v2.0.0
        with:
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          build_args: |
            RUBYGEM_OPENVOX=${{ matrix.openvox_version }}
          build_arch: linux/${{ matrix.platform }}
          build_context: .
          buildfile: Containerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-${{ matrix.platform }}

  create-multiarch-manifests:
    name: Create multi-architecture manifests
    runs-on: ubuntu-latest
    needs:
      - setup-matrix
      - build-and-push-container
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.manifest-matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: voxpupulibot
          password: ${{ secrets.DOCKERHUB_BOT_ADMIN_TOKEN }}

      - name: Create main manifests per OpenVox version
        if: github.ref_type == 'branch'
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/voxbox:main-openvox${{ matrix.openvox_release }} -t ghcr.io/${{ github.repository_owner }}/voxbox:main-openvox${{ matrix.openvox_version }} -t docker.io/${{ github.repository_owner }}/voxbox:main-openvox${{ matrix.openvox_release }} -t docker.io/${{ github.repository_owner }}/voxbox:main-openvox${{ matrix.openvox_version }} ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-arm64 ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-amd64

      - name: Create main multi-architecture manifests
        if: github.ref_type == 'branch' && matrix.openvox_version == needs.setup-matrix.outputs.openvox-version
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/voxbox:main -t ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }} -t docker.io/${{ github.repository_owner }}/voxbox:main -t docker.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }} ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-arm64 ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-amd64

      - name: Create release multi-architecture manifests
        if: github.ref_type == 'tag'
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/voxbox:${{ needs.setup-matrix.outputs.voxbox-version }}-openvox${{ matrix.openvox_version }} -t ghcr.io/${{ github.repository_owner }}/voxbox:${{ needs.setup-matrix.outputs.voxbox-version }}-openvox${{ matrix.openvox_release }} -t docker.io/${{ github.repository_owner }}/voxbox:${{ needs.setup-matrix.outputs.voxbox-version }}-openvox${{ matrix.openvox_version }} -t docker.io/${{ github.repository_owner }}/voxbox:${{ needs.setup-matrix.outputs.voxbox-version }}-openvox${{ matrix.openvox_release }} ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-arm64 ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-amd64

      - name: Update latest for the newest release
        if: github.ref_type == 'tag' && matrix.openvox_version == needs.setup-matrix.outputs.openvox-version
        run: |
          latest_version=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" | sed -n 's#.*refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p' | sort -V | tail -n 1); if [[ "${{ needs.setup-matrix.outputs.voxbox-version }}" == "$latest_version" ]]; then docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/voxbox:latest -t docker.io/${{ github.repository_owner }}/voxbox:latest ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-arm64 ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-amd64; else echo "Keeping latest at newer release $latest_version"; fi

  publish-info:
    name: Publish diagnostics
    runs-on: ubuntu-latest
    needs:
      - setup-matrix
      - build-and-push-container
    container: ghcr.io/voxpupuli/voxbox:sha-${{ github.sha }}-openvox${{ needs.setup-matrix.outputs.openvox-version }}-amd64
    steps:
      - name: Show image information
        run: |
          bundle check
          bundle env
          bundle outdated || true

  update-dockerhub-description:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    needs:
      - create-multiarch-manifests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: voxpupulibot
          password: ${{ secrets.DOCKERHUB_BOT_ADMIN_TOKEN }}
          repository: voxpupuli/voxbox
