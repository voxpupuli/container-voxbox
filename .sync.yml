---
:global:
  matrix_command: yq -o=json build_platforms.yaml | jq -c
  matrix_requires_yq: true
  build_args:
    - 'RUBYGEM_OPENVOX=${{ matrix.openvox_version }}'
    - 'RUBYGEM_OPENFACT=${{ matrix.openfact_version }}'
  build_runner: '${{ matrix.runner }}'
  image_tag: 'ci/voxbox:${{ matrix.openvox_version }}'
  build_platforms: 'linux/${{ matrix.platform }}'
.github/workflows/ci.yml:
  build_job_name: 'Build ${{ matrix.platform }} CI container'
  test_repository: voxpupuli/puppet-example
  test_commands:
    - 'docker run --rm -v "$PWD:/repo:Z" ci/voxbox:${{ matrix.openvox_version }}'
    - 'docker run --rm -v "$PWD:/repo:Z" ci/voxbox:${{ matrix.openvox_version }} lint'
    - 'docker run --rm -v "$PWD:/repo:Z" ci/voxbox:${{ matrix.openvox_version }} metadata_lint'
    - 'docker run --rm -v "$PWD:/repo:Z" ci/voxbox:${{ matrix.openvox_version }} r10k:dependencies'
    - 'docker run --rm -v "$PWD:/repo:Z" ci/voxbox:${{ matrix.openvox_version }} r10k:syntax'
    - 'docker run --rm -v "$PWD:/repo:Z" ci/voxbox:${{ matrix.openvox_version }} rubocop'
    - 'docker run --rm -v "$PWD:/repo:Z" ci/voxbox:${{ matrix.openvox_version }} spec'
    - 'docker run --rm -v "$PWD:/repo:Z" ci/voxbox:${{ matrix.openvox_version }} strings:validate:reference'
    - 'docker run --rm -v "$PWD:/repo:Z" ci/voxbox:${{ matrix.openvox_version }} syntax'
  post_test_commands:
    - 'docker run --rm --entrypoint=ash ci/voxbox:${{ matrix.openvox_version }} -c "bundle check"'
    - 'docker run --rm --entrypoint=ash ci/voxbox:${{ matrix.openvox_version }} -c "bundle env"'
    - 'docker run --rm --entrypoint=ash ci/voxbox:${{ matrix.openvox_version }} -c "bundle outdated || true"'
.github/workflows/security_scanning.yml:
  scan_job_name: 'Scan container (${{ matrix.label }})'
  sarif_category: 'grype-${{ matrix.label }}'
RELEASE.md:
  release_preamble: |
    VoxBox container releases use semantic versions starting at `10.0.0`.
    The Git tag must use the `vX.Y.Z` form; the image tags combine that version with the OpenVox flavor.
    For example, Git tag `v10.1.2` publishes `10.1.2-openvox8` and `10.1.2-openvox8.28.0`.
    Only the highest released semantic version updates the `latest` image tag.
.github/workflows/build_container.yml:
  publish_tag_patterns:
    - 'v[1-9][0-9]*.*.*'
  publish_build_job_name: 'Build VoxBox ${{ matrix.openvox_version }} (${{ matrix.platform }})'
  publish_build_arch: 'linux/${{ matrix.platform }}'
  publish_manifest_matrix_command: >-
    yq -o=json build_platforms.yaml | jq -c
    '{include: [.include[] | {openvox_release, openvox_version}] | unique_by(.openvox_version)}'
  publish_tags:
    - 'ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-${{ matrix.platform }}'
  publish_setup_outputs:
    openvox-release: '${{ steps.openvox-release.outputs.value }}'
    openvox-version: '${{ steps.openvox-version.outputs.value }}'
    voxbox-version: '${{ steps.voxbox-version.outputs.value }}'
  publish_setup_steps:
    - name: Select stable OpenVox release
      id: openvox-release
      commands:
        - echo "value=9" >> "$GITHUB_OUTPUT"
    - name: Select stable OpenVox version
      id: openvox-version
      commands:
        - >-
          value=$(yq -o=json build_platforms.yaml | jq -er
          '[.include[] | select(.openvox_release == 9) | .openvox_version] | unique |
          if length == 1 then .[0] else error("Configure exactly one OpenVox 9 version in build_platforms.yaml") end')
        - echo "value=$value" >> "$GITHUB_OUTPUT"
    - name: Determine VoxBox version
      id: voxbox-version
      commands:
        - >-
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
          [[ "$GITHUB_REF_NAME" =~ ^v[1-9][0-9]+\.[0-9]+\.[0-9]+$ ]]
          || { echo "Release tag must match vX.Y.Z with a major version of at least 10" >&2; exit 1; };
          value="${GITHUB_REF_NAME#v}";
          else value="main-${GITHUB_SHA::7}";
          fi;
          echo "value=$value" >> "$GITHUB_OUTPUT"
  publish_manifest_steps:
    - name: Create main manifests per OpenVox version
      if: github.ref_type == 'branch'
      commands:
        - >-
          docker buildx imagetools create
          -t ghcr.io/${{ github.repository_owner }}/voxbox:main-openvox${{ matrix.openvox_release }}
          -t ghcr.io/${{ github.repository_owner }}/voxbox:main-openvox${{ matrix.openvox_version }}
          -t docker.io/${{ github.repository_owner }}/voxbox:main-openvox${{ matrix.openvox_release }}
          -t docker.io/${{ github.repository_owner }}/voxbox:main-openvox${{ matrix.openvox_version }}
          ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-arm64
          ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-amd64
    - name: Create main multi-architecture manifests
      if: github.ref_type == 'branch' && matrix.openvox_version == needs.setup-matrix.outputs.openvox-version
      commands:
        - >-
          docker buildx imagetools create
          -t ghcr.io/${{ github.repository_owner }}/voxbox:main
          -t ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}
          -t docker.io/${{ github.repository_owner }}/voxbox:main
          -t docker.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-arm64
          ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-amd64
    - name: Create release multi-architecture manifests
      if: github.ref_type == 'tag'
      commands:
        - >-
          docker buildx imagetools create
          -t ghcr.io/${{ github.repository_owner }}/voxbox:${{ needs.setup-matrix.outputs.voxbox-version }}-openvox${{ matrix.openvox_version }}
          -t ghcr.io/${{ github.repository_owner }}/voxbox:${{ needs.setup-matrix.outputs.voxbox-version }}-openvox${{ matrix.openvox_release }}
          -t docker.io/${{ github.repository_owner }}/voxbox:${{ needs.setup-matrix.outputs.voxbox-version }}-openvox${{ matrix.openvox_version }}
          -t docker.io/${{ github.repository_owner }}/voxbox:${{ needs.setup-matrix.outputs.voxbox-version }}-openvox${{ matrix.openvox_release }}
          ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-arm64
          ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-amd64
    - name: Update latest for the newest release
      if: github.ref_type == 'tag' && matrix.openvox_version == needs.setup-matrix.outputs.openvox-version
      commands:
        - >-
          latest_version=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git"
          | sed -n 's#.*refs/tags/v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$#\1#p'
          | sort -V | tail -n 1);
          if [[ "${{ needs.setup-matrix.outputs.voxbox-version }}" == "$latest_version" ]]; then
          docker buildx imagetools create
          -t ghcr.io/${{ github.repository_owner }}/voxbox:latest
          -t docker.io/${{ github.repository_owner }}/voxbox:latest
          ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-arm64
          ghcr.io/${{ github.repository_owner }}/voxbox:sha-${{ github.sha }}-openvox${{ matrix.openvox_version }}-amd64;
          else echo "Keeping latest at newer release $latest_version";
          fi
  publish_info_container: 'ghcr.io/voxpupuli/voxbox:sha-${{ github.sha }}-openvox${{ needs.setup-matrix.outputs.openvox-version }}-amd64'
  publish_info_commands:
    - bundle check
    - bundle env
    - bundle outdated || true
  dockerhub_repository: voxpupuli/voxbox
